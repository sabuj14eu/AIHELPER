[project]
name = "ai-helper"
version = "1.0.0"
description = "A self-hosted, local-first AI gateway with paid-API fallback and solution learning"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/database/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the framework's idiom
    "SIM108", # a ternary is not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
# B011: bare `assert False` is how a test says "we should not get here".
# C408: dict(...) with keyword arguments reads better than a brace literal
#       when a test is assembling a payload it then updates.
"tests/*" = ["B011", "C408"]
