<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Helper{% endblock %}</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#1a1d21; --muted:#6b7280; --line:#e3e6ea;
    --ok:#0f7b4f; --warn:#a8620a; --bad:#b3261e; --accent:#1f4e8c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171a; --panel:#1c2024; --ink:#e8eaed; --muted:#9aa2ad; --line:#2c3238;
           --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#7aa7e0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:.7rem 1.2rem;
         display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header .brand{font-weight:650;letter-spacing:-.01em}
  header nav{display:flex;gap:1rem;flex-wrap:wrap}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  main{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem}
  h1{font-size:1.35rem;margin:.2rem 0 1rem}
  h2{font-size:1rem;margin:1.8rem 0 .6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:.8rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem}
  .card .label{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
  .card .value{font-size:1.5rem;font-weight:620;margin-top:.25rem;font-variant-numeric:tabular-nums}
  .card .sub{color:var(--muted);font-size:.76rem;margin-top:.15rem}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.83rem}
  th,td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:0}
  td.wrap{white-space:normal;max-width:520px}
  .pill{display:inline-block;padding:.1rem .45rem;border-radius:999px;font-size:.72rem;
        border:1px solid var(--line);font-weight:600}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .muted{color:var(--muted)}
  form.inline{display:inline}
  button,input[type=submit]{font:inherit;padding:.32rem .7rem;border-radius:7px;
        border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--accent)}
  input[type=text],input[type=password],select{font:inherit;padding:.4rem .55rem;border-radius:7px;
        border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem;align-items:center}
  .note{color:var(--muted);font-size:.8rem;margin:.4rem 0 1rem}
  .keybox{background:var(--panel);border:1px solid var(--warn);border-radius:10px;padding:.9rem 1rem;margin-bottom:1rem}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;
       background:rgba(127,127,127,.12);padding:.08rem .3rem;border-radius:4px}
</style>
</head>
<body>
<header>
  <span class="brand">AI Helper</span>
  <nav>
    <a href="/admin">Overview</a>
    <a href="/admin/solutions">Solutions</a>
    <a href="/admin/clients">Clients</a>
    <a href="/admin/audit">Audit</a>
    <a href="/docs">API docs</a>
  </nav>
  <span style="margin-left:auto" class="muted">
    {% if user %}{{ user }} ·
      <form class="inline" method="post" action="/admin/logout"><button>Sign out</button></form>
    {% endif %}
  </span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
